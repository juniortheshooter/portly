name: Build and release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Read-only by default: the test and build jobs run `npm ci` (every dependency's install
# script), so they must not hold a token that can push. Only the release job can write.
permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run tests in a throwaway data folder
        shell: bash
        run: |
          DEVDECK_DATA_DIR="$RUNNER_TEMP/portly-test" node test-multi-os.js
          node test-audit-fixes.js
          node test-stacks.js

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build installers
        run: npx electron-builder ${{ matrix.target }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: portly-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  source-zip:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package source edition
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NAME="Portly-OpenSource-${VERSION}-MultiOS"
          mkdir -p "stage/$NAME/data" out
          git archive HEAD --format=tar --prefix="$NAME/" --worktree-attributes \
            ':!.github' ':!DEV_NOTES.md' | tar -x -C stage
          echo '[]' > "stage/$NAME/data/projects.json"
          (cd stage && zip -r -q "../out/$NAME.zip" "$NAME")
      - uses: actions/upload-artifact@v4
        with:
          name: portly-source
          path: out/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, source-zip]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Write checksums
        working-directory: artifacts
        run: sha256sum * > SHA256SUMS.txt
      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/*
